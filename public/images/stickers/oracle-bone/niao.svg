  <!-- wing -->
  <path d="M28 28 Q38 22 46 28 Q40 34 32 30" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- tail feathers -->
