  <path d="M32 34 Q30 44 24 54" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M32 34 Q36 44 32 54" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- legs/claws -->
