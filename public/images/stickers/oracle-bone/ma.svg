<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- 马 oracle bone: horse standing, mane, four legs, tail -->
  <!-- body -->
  <path d="M18 38 Q18 20 32 14 Q46 20 46 38 Q46 50 32 56 Q18 50 18 38" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- neck/head -->
  <path d="M20 30 Q14 18 10 12 Q8 8 14 6 Q20 4 28 8 Q34 12 32 20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ear -->
  <path d="M22 12 Q18 6 24 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- eye -->
  <circle cx="16" cy="12" r="2" stroke="currentColor" stroke-width="1.5" fill="currentColor"/>
  <!-- mane -->
  <path d="M24 22 Q20 28 22 36" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M28 20 Q24 26 26 34" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- front legs -->
  <path d="M22 38 Q20 50 24 58" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M28 36 Q26 48 30 56" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- hind legs -->
  <path d="M38 38 Q36 50 40 58" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M44 36 Q42 48 44 56" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- tail -->
  <path d="M46 38 Q54 38 58 34 Q60 30 56 26" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>