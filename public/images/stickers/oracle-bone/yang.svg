<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- 羊 oracle bone: sheep/goat with curled horns, woolly body -->
  <!-- woolly body - scalloped edge -->
  <path d="M20 36 Q20 20 32 14 Q44 20 44 36 Q48 44 42 50 Q36 54 28 54 Q20 54 16 48 Q12 42 20 36" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- head -->
  <path d="M22 32 Q18 26 20 18 Q24 12 32 12 Q40 12 42 18 Q44 26 40 32" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- horns - curled backward -->
  <path d="M26 14 Q20 8 18 4 Q16 0 22 -2" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M38 14 Q44 8 46 4 Q48 0 42 -2" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- ears -->
  <path d="M24 20 Q20 18 22 24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M40 20 Q44 18 38 24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="28" cy="20" r="2" stroke="currentColor" stroke-width="1.5" fill="currentColor"/>
  <circle cx="36" cy="20" r="2" stroke="currentColor" stroke-width="1.5" fill="currentColor"/>
  <!-- front legs -->
  <path d="M24 36 Q22 48 26 56" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M32 36 Q30 48 34 56" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- hind legs -->
  <path d="M38 36 Q36 48 38 56" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M44 36 Q42 48 42 56" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- tail -->
  <path d="M44 36 Q50 34 52 30" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>