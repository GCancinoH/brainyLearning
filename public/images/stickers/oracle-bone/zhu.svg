<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- 猪 oracle bone: pig with large snout, stout body, curly tail -->
  <!-- body -->
  <path d="M16 36 Q16 22 32 16 Q48 22 48 36 Q48 50 32 56 Q16 50 16 36" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- head with large snout -->
  <path d="M20 30 Q14 24 10 18 Q8 14 14 10 Q22 6 30 10 Q38 14 36 18 Q32 24 20 30" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- snout (large, distinctive) -->
  <ellipse cx="24" cy="20" rx="8" ry="6" stroke="currentColor" stroke-width="2.5" fill="none"/>
  <!-- nostrils -->
  <circle cx="20" cy="19" r="1.5" stroke="currentColor" stroke-width="1.5" fill="currentColor"/>
  <circle cx="28" cy="19" r="1.5" stroke="currentColor" stroke-width="1.5" fill="currentColor"/>
  <!-- ears -->
  <path d="M18 16 Q14 10 18 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M30 16 Q34 10 30 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="20" cy="22" r="2" stroke="currentColor" stroke-width="1.5" fill="currentColor"/>
  <circle cx="28" cy="22" r="2" stroke="currentColor" stroke-width="1.5" fill="currentColor"/>
  <!-- front legs -->
  <path d="M20 36 Q18 48 22 56" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M28 36 Q26 48 30 56" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- hind legs -->
  <path d="M38 36 Q36 48 38 56" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M44 36 Q42 48 42 56" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- curly tail -->
  <path d="M48 36 Q56 34 60 28 Q62 22 58 18 Q54 14 56 18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>