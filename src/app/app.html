<!-- SplashScreen inicial -->
@if (showSplash()) {
  <splash-screen (loaded)="onSplashFinished()" />
}

<!-- Vista Principal una vez finalizada la carga -->
<main class="main-layout" [class.visible]="!showSplash()" [class.with-clock]="clockVisible()">
  <!-- El Router renderizará las pantallas (Profiles, Games, Dashboard) aquí adentro -->
  <router-outlet />
</main>

<!-- Reloj de tiempo de juego (arriba a la derecha, solo dentro de un juego) -->
@if (clockVisible()) {
  <game-clock />
}

<!-- Insignias: escucha la cola global y decide cuándo interrumpir.
     Carga diferida: solo se necesita cuando se gana una insignia (raro al inicio). -->
@defer (on idle) {
  <badge-host />
} @placeholder {
  <!-- placeholder vacío; badge-host se hidrata solo cuando hay insignias -->
}

<!-- Install Prompt PWA -->
<app-install-prompt />

<!-- Dialog Updater -->
@if (updateAvailable()) {
  <sw-update-dialog />
}
