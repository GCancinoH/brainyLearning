@if(isVisible()) {
<div class="overlay" role="dialog" aria-modal="true">
  <div class="card">
    <div class="lottie">
      <lottie-wrapper
        [src]="lottieSrc"
        [isVisible]="isVisible()"
        (onReady)="onLottieReady()"
      />
    </div>
    <h2>¡Subiste al nivel {{ level() }}! 🎉</h2>
    <p>{{ message() }}</p>
    <button class="advance-btn" (click)="advance.emit()">Avanzar ▶</button>
  </div>
</div>
}
