@if (isVisible() && badge(); as b) {
  <div
    class="badge-backdrop"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="b.name"
    (click)="onBackdrop()"
    (keydown.tab)="$event.preventDefault()"
  >
    <div class="badge-card" [class.celebrate]="isCelebration()" [class.pre-reader]="!isReader()" (click)="$event.stopPropagation()">
      <div class="sparkles" aria-hidden="true">✨</div>

      <badge-art [badge]="b" size="lg" />

      @if (isReader()) {
        <h2>{{ b.name }}</h2>
      }

      <div class="mascot">
        <span class="mascot-emoji" aria-hidden="true">{{ mascot().emoji }}</span>
        @if (isReader()) {
          <span class="mascot-name">{{ mascot().name }}</span>
        }
      </div>

      @if (queueSize() > 1) {
        <!-- Máx. 4 por sesión (1 a mitad + 3 al final); el resto sale en el álbum -->
        <span class="queue" [attr.aria-label]="'Quedan ' + (displayQueueSize() - 1) + ' insignias esta sesión' + (extraForAlbum() > 0 ? ' y ' + extraForAlbum() + ' en el álbum' : '')">
          ×{{ displayQueueSize() }}
          @if (extraForAlbum() > 0) {
            <span class="album-hint">+{{ extraForAlbum() }} álbum</span>
          }
        </span>
      }

      <button #saveButton type="button" class="save-btn" [attr.aria-label]="'Guardar ' + b.name" (click)="dismiss.emit()">
        {{ saveLabel() }}
      </button>
    </div>
  </div>
}
