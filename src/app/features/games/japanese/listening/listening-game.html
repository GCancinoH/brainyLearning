<!-- Pantalla de descanso (fin de sesión) -->
<game-rest-overlay
  [isVisible]="isTimeUp()"
  (onBack)="onRestOverlayBack()"
/>

<!-- Intro -->
@if (phase() === 'intro') {
<word-intro-carousel
  [words]="introWords()"
  [showReading]="profileConfig().requiresReading"
  (done)="onIntroDone()"
/>
}

<div class="listening-game-container">
  <!-- ENCABEZADO -->
  <header class="game-header">
    <button class="back-btn" (click)="goBack()">⬅️ Menú</button>
    <div class="level-badge">
      <span>Nivel {{ currentLevel() }}</span>
      <div class="stars">
        @for (s of starSlots(); track s) {
          <span [class.active]="s < consecutiveCorrect()">⭐</span>
        }
      </div>
    </div>
  </header>

  <!-- ÁREA DEL EJERCICIO -->
  <main class="game-board">
    <!-- MENSAJE DE RETROALIMENTACIÓN -->
    <game-feedback
      [state]="feedbackState()"
      [customMessages]="customFeedbackMessages"
      [customMessage]="idleMessage"
    ></game-feedback>

    <!-- PREGUNTA: Área de audio grande -->
    <div class="question-area" (click)="replayAudio()">
      <div class="audio-button" [class.playing]="false">
        <span class="audio-icon">🔊</span>
        <span class="audio-label">Escuchar</span>
      </div>
      <p class="audio-hint">Toca para volver a escuchar</p>
    </div>

    <!-- OPCIONES DE RESPUESTA -->
    <div class="options-grid">
      @for (opt of options(); track opt.id; let idx = $index) {
        <button
          class="option-btn"
          [class.hiragana-mode]="profileConfig().requiresReading && _showHiragana()"
          [class.preschool-mode]="isPreschoolProfile()"
          [class.disabled]="_disabledOptions().includes(opt.id)"
          [class.correct]="feedbackState() === 'success' && idx === correctIndex()"
          [class.hint]="showHint() && idx === correctIndex()"
          (click)="selectOption(opt.id)"
          [attr.aria-label]="getOptionAriaLabel(opt)"
        >
          <div class="option-content">
            @if (isPreschoolProfile()) {
              <!-- Solo imagen para preescolar -->
              <span class="option-image">{{ getImageEmoji(opt) }}</span>
            } @else {
              <!-- Modo hiragana/kanji: imagen arriba, texto abajo -->
              <div class="option-layout">
                <span class="option-image">{{ getImageEmoji(opt) }}</span>
                <span class="option-main">{{ getOptionDisplay(opt).main }}</span>
              </div>
            }
          </div>
        </button>
      }
    </div>
  </main>
</div>
<!-- Level Up Dialog -->
<level-up-dialog [isVisible]="levelUpVisible()" [level]="levelUpTarget()" (advance)="onAdvance()" />
